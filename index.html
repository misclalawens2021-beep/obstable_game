<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jeu de Plateforme</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div id="ui">
    <div class="grp"><div>Niveau : <span id="level">1</span></div><div>Score : <span id="score">0</span></div></div>
    <div class="grp"><div id="lives">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div><div>Meilleur : <span id="best">0</span></div></div>
  </div>
  <canvas id="game" width="800" height="450"></canvas>
  
  <!-- Contrôles tactiles (visible uniquement sur mobile) -->
  <div id="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn small" id="btn-left">◀</button>
      <button class="ctrl-btn small" id="btn-right">▶</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn jump" id="btn-jump">▲<br><span style="font-size:11px;">SAUTER</span></button>
    </div>
  </div>
  
  <div id="info">
    <button class="btn" id="restart">Recommencer</button>
    <span id="desktop-controls">
      &nbsp; &larr; &rarr; : se déplacer &nbsp;|&nbsp; Espace / &uarr; : sauter &nbsp;|&nbsp; P : pause
    </span>
    <span id="mobile-controls" style="display:none;">
      &nbsp; Boutons tactiles &nbsp;|&nbsp; P : pause
    </span>
  </div>
  
  <div id="mode-indicator">
    <span class="pc-mode">🖥️ Mode PC - Utilisez le clavier</span>
    <span class="mobile-mode">📱 Mode Mobile - Utilisez les boutons tactiles</span>
  </div>
<script src="./assets/game.js"></script>
</body>
</html>
